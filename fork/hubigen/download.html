<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{name}} downloaden</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f5f5f7; --card: #fff; --ink: #1d1d1f; --muted: #6e6e73; --btn: #1d1d1f; --btn-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6; --btn: #f5f5f7; --btn-ink: #000; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 40px 32px; text-align: center;
         box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.06); }
  img { width: 112px; height: 112px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 16px 0 4px; }
  p { margin: 0; color: var(--muted); }
  a.button { display: inline-block; margin: 28px 0 12px; padding: 12px 28px; border-radius: 999px; background: var(--btn); color: var(--btn-ink);
             font-weight: 600; text-decoration: none; }
  a.button:hover { opacity: .85; }
  small { display: block; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>{{name}}</h1>
  <p>De {{name}}-app voor je Mac.</p>
  <a class="button" href="mac/{{dmg}}">Download voor Mac</a>
  <small>Versie {{version}} · Mac met Apple-chip (M1 of nieuwer)</small>
  <small>Daarna houdt de app zichzelf up-to-date.</small>
</main>
</body>
</html>
